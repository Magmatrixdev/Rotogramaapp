<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1c1c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rotogramas — Confiança</title>
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:0;height:0}
body{background:#f4f4f2;font-family:'Barlow Condensed',sans-serif;color:#1c1c1c;min-height:100vh;overscroll-behavior-y:contain}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}

/* ═══ HOME ═══ */
.home-top{padding:20px 22px 0}
.logo-row{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.logo-box{width:42px;height:42px;background:#fe2627;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(254,38,39,.28)}
.logo-box span{font-weight:800;font-size:27px;color:#fff;line-height:1}
.logo-title{font-weight:700;font-size:20px;letter-spacing:.06em;color:#1c1c1c;line-height:1}
.logo-sub{font-family:'Barlow',sans-serif;font-weight:500;font-size:9.5px;letter-spacing:.28em;color:#9a9894;margin-top:3px}
.home-heading{font-weight:700;font-size:34px;color:#1c1c1c;line-height:.95;text-transform:uppercase}
.home-subtext{font-family:'Barlow',sans-serif;font-size:13px;color:#8a8886;margin-top:6px}

.search-wrap{margin-top:18px;position:relative}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:15px;height:15px;border:2px solid #b0aea9;border-radius:50%}
.search-icon::after{content:'';position:absolute;left:11px;top:12px;width:7px;height:2px;background:#b0aea9;transform:rotate(45deg);transform-origin:left}
.search-input{width:100%;height:50px;background:#fff;border:1.5px solid #e4e2dd;border-radius:14px;padding:0 18px 0 44px;font-family:'Barlow',sans-serif;font-size:14.5px;color:#1c1c1c;outline:none;box-shadow:0 2px 8px rgba(40,38,34,.04);-webkit-appearance:none}
.search-input:focus{border-color:#fe2627}
.search-input::placeholder{color:#b0aea9}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#e4e2dd;border:none;width:28px;height:28px;border-radius:50%;font-size:14px;color:#8a8886;cursor:pointer;display:none;align-items:center;justify-content:center}
.search-clear.vis{display:flex}

.home-scroll{flex:1;overflow-y:auto;padding:20px 22px 28px}

/* REGION */
.region{margin-bottom:26px}
.region-hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.region-bar{width:4px;height:17px;background:#fe2627;border-radius:2px;flex-shrink:0}
.region-name{font-weight:700;font-size:15px;letter-spacing:.16em;color:#1c1c1c;text-transform:uppercase}
.region-count{font-family:'Barlow',sans-serif;font-size:11px;color:#8a8886;background:#eae8e3;padding:2px 9px;border-radius:20px}
.region-line{flex:1;height:1px;background:#e4e2dd}

/* ROUTE CARD */
.rcard{cursor:pointer;background:#fff;border:1.5px solid #e8e6e1;border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(40,38,34,.04);transition:border-color .15s,transform .1s}
.rcard:active{transform:scale(.98);border-color:#fe2627}
.rcard-uf{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:#262625;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#f4f4f2;line-height:1}
.rcard-info{flex:1;min-width:0}
.rcard-nome{font-weight:700;font-size:18px;color:#1c1c1c;line-height:1.05;text-transform:uppercase}
.rcard-detail{font-family:'Barlow',sans-serif;font-size:12px;color:#8a8886;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-stats{display:flex;gap:8px;margin-top:7px;font-family:'Barlow',sans-serif;font-size:11.5px;color:#9a9894}
.rcard-stats .red{color:#fe2627;font-weight:600}
.rcard-stats .dot{color:#cfcdc7}
.rcard-arrow{flex:0 0 auto;color:#c2c0ba;font-size:22px;font-weight:300}

.no-results{text-align:center;padding:50px 20px;color:#9a9894;font-family:'Barlow',sans-serif;display:none}
.no-results span{font-size:40px;display:block;margin-bottom:8px}

/* STATUS */
.home-status{font-family:'Barlow',sans-serif;font-size:11px;color:#9a9894;text-align:center;padding:8px 22px 0}
.home-status .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.home-status .dot.on{background:#1f8a3d}
.home-status .dot.demo{background:#e8a020}

/* CONFIG */
.config-bar{padding:16px 22px 28px}
.config-bar label{font-family:'Barlow',sans-serif;font-size:10px;font-weight:600;letter-spacing:.1em;color:#9a9894;text-transform:uppercase;display:block;margin-bottom:6px}
.config-bar input{width:100%;padding:12px;border:1.5px solid #e4e2dd;border-radius:10px;font-size:13px;font-family:'Barlow',sans-serif;background:#fff;color:#1c1c1c}
.config-bar input:focus{outline:none;border-color:#fe2627}
.config-bar .hint{font-family:'Barlow',sans-serif;font-size:10px;color:#b0aea9;margin-top:5px;line-height:1.4}
.config-bar button{margin-top:10px;width:100%;padding:13px;background:#fe2627;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;min-height:48px}
.config-bar button:active{background:#e01f20}

/* ═══ ROTOGRAMA ═══ */
.roto-top{flex:0 0 auto;padding:14px 20px 0}
.back-btn{cursor:pointer;width:42px;height:42px;border-radius:12px;background:#eae8e3;border:none;display:flex;align-items:center;justify-content:center;color:#1c1c1c;font-size:24px;font-weight:700}
.back-btn:active{background:#e4e2dd}
.roto-header{margin-top:14px}
.roto-route-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.roto-chip{background:#eae8e3;border-radius:10px;padding:8px 14px;text-align:center}
.roto-chip .city{font-weight:700;font-size:15px;color:#1c1c1c;text-transform:uppercase;line-height:1}
.roto-chip .lbl{font-family:'Barlow',sans-serif;font-size:10px;color:#9a9894;letter-spacing:.1em;margin-top:2px}
.roto-arrow{font-size:20px;color:#b0aea9}
.roto-stats{display:flex;gap:8px;margin-top:14px}
.roto-stat{flex:1;background:#fff;border:1px solid #e8e6e1;border-radius:11px;padding:9px 8px;text-align:center}
.roto-stat .val{font-weight:700;font-size:19px;color:#1c1c1c}
.roto-stat .val.red{color:#fe2627}
.roto-stat .lbl{font-family:'Barlow',sans-serif;font-size:9.5px;color:#9a9894;letter-spacing:.1em;margin-top:1px}

/* LINK ROTA */
.rota-link{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:12px;background:#262625;border-radius:10px;color:#f4f4f2;font-weight:700;font-size:13px;text-decoration:none;min-height:46px}
.rota-link:active{background:#3a3a38}

/* TIMELINE */
.roto-scroll{flex:1;overflow-y:auto;padding:16px 20px 28px}
.timeline-wrap{position:relative}
.timeline-line{position:absolute;left:26px;top:10px;bottom:10px;width:2px;background:linear-gradient(#fe2627,#4a4a49)}
.timeline-stops{display:flex;flex-direction:column;gap:16px}

/* STOP */
.stop{position:relative;padding-left:56px}
.stop-node{position:absolute;left:15px;top:8px;width:24px;height:24px;border-radius:50%;background:#f4f4f2;border:2px solid #fe2627;display:flex;align-items:center;justify-content:center}
.stop-node-dot{width:8px;height:8px;border-radius:50%;background:#fe2627}
.stop-node.parcial{border-color:#e8a020}
.stop-node.parcial .stop-node-dot{background:#e8a020}
.stop-node.dest{border-color:#4a4a49;background:#4a4a49}
.stop-node.dest .stop-node-dot{background:#fff;width:9px;height:9px;border-radius:2px}
.stop-km{position:absolute;left:50px;top:6px;font-family:'Barlow',sans-serif;font-weight:700;font-size:10px;color:#fe2627;background:#f4f4f2;padding:2px 0}
.stop-km.parcial{color:#e8a020}
.stop-km.dest{color:#4a4a49}

/* STOP CARD */
.scard{margin-top:18px;background:#fff;border:1.5px solid #e8e6e1;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(40,38,34,.05)}
.scard.dashed{border-style:dashed}
.scard-body{padding:14px 15px 12px}
.scard-brand-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.scard-brand-dot{width:9px;height:9px;border-radius:3px}
.scard-brand-name{font-family:'Barlow',sans-serif;font-weight:600;font-size:11px;letter-spacing:.06em;color:#9a9894;text-transform:uppercase}
.scard-nome{font-weight:700;font-size:18px;color:#1c1c1c;line-height:1.05;text-transform:uppercase}
.scard-cidade{font-family:'Barlow',sans-serif;font-size:12px;color:#8a8886;margin-top:4px;line-height:1.3}
.scard-details{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.scard-detail{display:flex;align-items:center;gap:7px;font-family:'Barlow',sans-serif;font-size:12.5px;color:#8a8886}
.scard-detail strong{color:#1c1c1c;font-weight:600}

/* BADGES */
.badge-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.badge-conv{display:inline-flex;align-items:center;gap:5px;background:rgba(31,138,61,.12);color:#1f8a3d;font-family:'Barlow',sans-serif;font-weight:600;font-size:10.5px;padding:5px 9px;border-radius:8px;white-space:nowrap}
.badge-conv::before{content:'';width:6px;height:6px;border-radius:50%;background:#1f8a3d}
.badge-cartao{font-family:'Barlow',sans-serif;font-weight:600;font-size:10.5px;padding:5px 9px;border-radius:8px;white-space:nowrap}
.badge-truckpag{background:rgba(31,138,61,.12);color:#1f8a3d}
.badge-shell{background:rgba(224,168,20,.12);color:#b8860b}

/* NOTE */
.scard-note{margin:10px 0 0;background:#f4f4f2;border-left:3px solid #1a6fb5;border-radius:8px;padding:10px 12px;font-family:'Barlow',sans-serif;font-size:12px;color:#8a8886;line-height:1.4}
.scard-note strong{color:#1a6fb5}

/* BRAND TABLE */
.brand-tbl{width:100%;border-collapse:collapse;margin-top:10px}
.brand-tbl th{font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;color:#9a9894;text-transform:uppercase;padding:6px 10px;text-align:left;border-bottom:1px solid #eae8e3}
.brand-tbl td{padding:8px 10px;font-family:'Barlow',sans-serif;font-size:13px;border-bottom:1px solid #f4f4f2}
.brand-tbl tr:last-child td{border:none}
.brand-tbl .bname{font-weight:700;color:#1c1c1c}
.brand-tbl .bqty{font-weight:700;color:#1a6fb5}
.brand-tbl .bqty.zero{color:#1f8a3d}

/* ACTIONS */
.scard-actions{display:flex;border-top:1px solid #eeece7}
.scard-actions a,.scard-actions button{flex:1;text-align:center;padding:11px 0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12.5px;color:#262625;text-decoration:none;border:none;background:none;cursor:pointer;border-right:1px solid #eeece7}
.scard-actions a:last-child,.scard-actions button:last-child{border-right:none}
.scard-actions a:active,.scard-actions button:active{background:#f4f4f2}
.scard-actions .red{color:#fe2627}

/* OU DIVIDER */
.ou-div{display:flex;align-items:center;gap:10px;padding:4px 0;margin-left:56px}
.ou-line{flex:1;height:1px;background:#e4e2dd}
.ou-pill{font-weight:700;font-size:13px;color:#fe2627;background:#eae8e3;padding:3px 14px;border-radius:10px}

/* DEST STOP */
.dest-stop{position:relative;padding-left:56px;margin-top:4px}
.dest-stop .stop-node{top:2px}
.dest-nome{padding:3px 0;font-weight:700;font-size:15px;color:#1c1c1c;text-transform:uppercase}

/* INSTALL */
.install-bar{display:none;background:#1c1c1c;padding:12px 16px;align-items:center;gap:12px}
.install-bar.show{display:flex}
.install-bar p{flex:1;font-family:'Barlow',sans-serif;font-size:13px;color:#fff}
.install-btn{background:#fe2627;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
.install-x{background:none;border:none;color:#666;font-size:20px;cursor:pointer}
</style>
</head>
<body>

<div class="install-bar" id="installBanner">
  <p>Instale o app na tela inicial</p>
  <button class="install-btn" id="installBtn">Instalar</button>
  <button class="install-x" id="installDismiss">✕</button>
</div>

<!-- HOME -->
<div class="screen active" id="screenHome">

    <div class="logo-row">
      <div class="logo-box"><span>C</span></div>

      </div>

    <div class="home-subtext" id="routeCountText">Carregando...</div>
    <div class="search-wrap">
      <div class="search-icon"></div>
      <input class="search-input" id="searchInput" placeholder="Buscar rota, cidade ou destino" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div class="home-status" id="statusBar">
    <span class="dot demo"></span><span id="statusText">Carregando...</span>
  </div>

  <div class="home-scroll" id="routeList">
    <div style="text-align:center;padding:40px"><div style="width:36px;height:36px;border:3px solid #e4e2dd;border-top-color:#fe2627;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto"></div><p style="font-family:'Barlow',sans-serif;font-size:13px;color:#9a9894;margin-top:12px">Carregando rotas...</p></div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>

  <div class="config-bar">
    <label>Planilha Google (opcional)</label>
    <input type="url" id="sheetUrl" placeholder="Cole a URL da planilha publicada como CSV">
    <div class="hint">Arquivo → Publicar na Web → aba "rotogramas" → CSV</div>
    <button onclick="saveSheetUrl()">Salvar e atualizar</button>
  </div>
</div>

<!-- ROTOGRAMA -->
<div class="screen" id="screenRoute">
  <div id="routeContent"></div>
</div>

// SHEETS PARSER
// ══════════════════════════════════════════
async function fetchFromSheet(url){try{const r=await fetch(url);if(!r.ok)throw 0;return parseCSV(await r.text())}catch(e){return null}}
function parseCSV(t){const ls=t.split('\n').map(l=>{const r=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c.trim());c=''}else c+=ch}r.push(c.trim());return r});if(ls.length<2)return null;const h=ls[0].map(x=>x.toLowerCase().replace(/\s+/g,'_'));const rows=ls.slice(1).filter(r=>r.length>=3&&r[0]);const rm={};for(const row of rows){const o={};h.forEach((k,i)=>{o[k]=row[i]||''});const id=o.rota_id||'default';if(!rm[id])rm[id]={id,nome:o.rota_nome||id,estados:o.estados||'',numero:o.rota_numero||'?',regiao:o.regiao||'',subtitulo:o.subtitulo||'',linkRota:o.link_rota||'',distancia:o.distancia||'',tempo:o.tempo||'',paradas:[]};const p={ordem:parseInt(o.ordem)||0,tipo:o.tipo||'completa',nome:o.posto||o.nome||'',cidade:o.cidade||'',litragem:o.litragem||'',cartao:(o.cartao||'').toLowerCase(),km:o.km||'',link:o.link_maps||o.link||'',razaoSocial:o.razao_social||'',vantagem:o.vantagem||'',nota:o.nota||'',detalhe:o.detalhe||''};if(o.alt_posto)p.alternativa={nome:o.alt_posto,cidade:o.alt_cidade||'',litragem:o.alt_litragem||p.litragem,cartao:(o.alt_cartao||p.cartao).toLowerCase(),km:o.alt_km||'',nota:o.alt_nota||'',link:o.alt_link||''};rm[id].paradas.push(p)}const res=Object.values(rm);res.forEach(r=>r.paradas.sort((a,b)=>a.ordem-b.ordem));return res}

// ══════════════════════════════════════════
// RENDER HOME
// ══════════════════════════════════════════
function norm(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function searchText(r){const p=[r.nome,r.estados,r.subtitulo,r.numero,r.regiao||''];for(const s of r.paradas){p.push(s.nome,s.cidade,s.cartao,s.razaoSocial||'');if(s.alternativa)p.push(s.alternativa.nome,s.alternativa.cidade)}return p.join(' ').toLowerCase()}

function renderHome(){
  const el=document.getElementById('routeList');
  const regionMap={};
  routes.forEach((r,i)=>{const reg=r.regiao||'Outras';if(!regionMap[reg])regionMap[reg]=[];regionMap[reg].push({r,i})});
  const sorted=Object.keys(regionMap).sort((a,b)=>{const ia=REGION_ORDER.indexOf(a),ib=REGION_ORDER.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)});
  let h='';
  for(const reg of sorted){
    const items=regionMap[reg];
    h+=`<div class="region"><div class="region-hd"><span class="region-bar"></span><span class="region-name">${reg}</span><span class="region-count">${items.length}</span><span class="region-line"></span></div>`;
    for(const{r,i}of items){
      const stops=r.paradas.filter(p=>p.tipo!=='origem'&&p.tipo!=='destino').length;
      const st=searchText(r);
      const orig=r.paradas.find(p=>p.tipo==='origem');
      const dest=r.paradas.find(p=>p.tipo==='destino');
      h+=`<div class="rcard" data-idx="${i}" data-search="${norm(st)}" onclick="showRoute(${i})"><div class="rcard-uf">${r.numero}</div><div class="rcard-info"><div class="rcard-nome">${r.nome}</div><div class="rcard-detail">${r.estados}</div><div class="rcard-stats"><span>${r.distancia||''}</span><span class="dot">·</span><span>${r.tempo||''}</span><span class="dot">·</span><span class="red">⛽ ${stops} posto${stops!==1?'s':''}</span></div></div><div class="rcard-arrow">›</div></div>`;
    }
    h+='</div>';
  }
  h+='<div class="no-results" id="noResults"><span>🔍</span>Nenhuma rota encontrada</div>';
  el.innerHTML=h;
  document.getElementById('routeCountText').textContent=`${routes.length} rotas ativas · toque para abrir o rotograma`;
  const inp=document.getElementById('searchInput');
  if(inp&&inp.value.trim())filterRoutes(inp.value);
}

function filterRoutes(q){
  const cards=document.querySelectorAll('.rcard');
  const regions=document.querySelectorAll('.region');
  const nr=document.getElementById('noResults');
  const cl=document.getElementById('searchClear');
  const n=norm(q.trim());
  if(!n){cards.forEach(c=>c.style.display='');regions.forEach(r=>r.style.display='');nr.style.display='none';cl.classList.remove('vis');return}
  cl.classList.add('vis');
  const terms=n.split(/\s+/);
  let vis=0;
  cards.forEach(c=>{const t=c.dataset.search||'';const m=terms.every(x=>t.includes(x));c.style.display=m?'':'none';if(m)vis++});
  regions.forEach(r=>{const hasVis=[...r.querySelectorAll('.rcard')].some(c=>c.style.display!=='none');r.style.display=hasVis?'':'none'});
  nr.style.display=vis?'none':'block';
}
function clearSearch(){const i=document.getElementById('searchInput');i.value='';filterRoutes('');i.focus()}
document.addEventListener('DOMContentLoaded',()=>{const i=document.getElementById('searchInput');if(i)i.addEventListener('input',e=>filterRoutes(e.target.value))});

// ══════════════════════════════════════════
// RENDER ROTOGRAMA
// ══════════════════════════════════════════
function cartaoBadge(c){const m={truckpag:['badge-truckpag','TRUCKPAG'],shell:['badge-shell','SHELL'],shell_expers:['badge-shell','SHELL EXPERS']};const v=m[c];return v?`<span class="badge-cartao ${v[0]}">${v[1]}</span>`:''}
function cartaoLabel(c){return{truckpag:'TruckPag',shell:'Shell',shell_expers:'Shell Expers'}[c]||c}

function renderStop(p){
  const isParcial=p.tipo==='parcial';
  const nodeClass=isParcial?'parcial':'';
  const kmClass=isParcial?'parcial':'';
  let details='';
  if(p.litragem)details+=`<div class="scard-detail">⛽ <strong>${p.litragem}</strong></div>`;
  if(p.razaoSocial)details+=`<div class="scard-detail">📋 ${p.razaoSocial}</div>`;
  if(p.vantagem)details+=`<div class="scard-detail">💰 ${p.vantagem}</div>`;
  if(p.detalhe)details+=`<div class="scard-detail">🛣️ ${p.detalhe}</div>`;
  let note=p.nota?`<div class="scard-note"><strong>Estratégia:</strong> ${p.nota}</div>`:'';
  let brandTbl='';
  if(p.marcas&&p.marcas.length){brandTbl='<table class="brand-tbl"><thead><tr><th>Marca</th><th>Litragem</th></tr></thead><tbody>';for(const m of p.marcas){const cls=m.litros.toLowerCase().includes('não')?'bqty zero':'bqty';brandTbl+=`<tr><td class="bname">${m.marca}</td><td class="${cls}">${m.litros}</td></tr>`}brandTbl+='</tbody></table>'}
  const tipoLabel=p.tipo==='parcial'?`${p.ordem}º Abast. · Parcial`:`${p.ordem}º Abastecimento`;
  let actions='';
  if(p.link)actions=`<div class="scard-actions"><a href="${p.link}" target="_blank">📍 Maps</a><a href="https://waze.com/ul?ll=${encodeURIComponent(p.link)}&navigate=yes" target="_blank">🧭 Waze</a></div>`;
  return `<div class="stop"><div class="stop-node ${nodeClass}"><div class="stop-node-dot"></div></div><div class="stop-km ${kmClass}">KM ${p.km}</div><div class="scard"><div class="scard-body"><div class="scard-brand-row"><div class="scard-brand-dot" style="background:${isParcial?'#e8a020':'#fe2627'}"></div><span class="scard-brand-name">${tipoLabel}</span></div><div class="scard-nome">${p.nome}</div><div class="scard-cidade">${p.cidade}</div>${details?`<div class="scard-details">${details}</div>`:''}${brandTbl}<div class="badge-row">${cartaoBadge(p.cartao)}</div>${note}</div>${actions}</div></div>`;
}

function renderAlt(a){
  let details=a.litragem?`<div class="scard-details"><div class="scard-detail">⛽ <strong>${a.litragem}</strong></div></div>`:'';
  let note=a.nota?`<div class="scard-note"><strong>Estratégia:</strong> ${a.nota}</div>`:'';
  let actions=a.link?`<div class="scard-actions"><a href="${a.link}" target="_blank">📍 Maps</a></div>`:'';
  return `<div class="ou-div"><div class="ou-line"></div><div class="ou-pill">OU</div><div class="ou-line"></div></div><div class="stop"><div class="stop-node parcial"><div class="stop-node-dot"></div></div><div class="stop-km parcial">KM ${a.km}</div><div class="scard dashed"><div class="scard-body"><div class="scard-brand-row"><div class="scard-brand-dot" style="background:#e8a020"></div><span class="scard-brand-name">Opção B</span></div><div class="scard-nome">${a.nome}</div><div class="scard-cidade">${a.cidade}</div>${details}<div class="badge-row">${cartaoBadge(a.cartao)}</div>${note}</div>${actions}</div></div>`;
}

function renderRoute(r){
  const orig=r.paradas.find(p=>p.tipo==='origem');
  const dest=r.paradas.find(p=>p.tipo==='destino');
  const stops=r.paradas.filter(p=>p.tipo!=='origem'&&p.tipo!=='destino');
  const origCity=(orig?orig.nome:'').split('—')[0].trim();
  const destCity=(dest?dest.nome:'').split('—')[0].trim();

  let h=`<div class="roto-top"><button class="back-btn" onclick="showHome()">‹</button><div class="roto-header"><div class="roto-route-row"><div class="roto-chip"><div class="city">${origCity}</div><div class="lbl">ORIGEM</div></div><span class="roto-arrow">→</span><div class="roto-chip"><div class="city">${destCity}</div><div class="lbl">DESTINO</div></div></div><div class="roto-stats"><div class="roto-stat"><div class="val">${r.distancia||'—'}</div><div class="lbl">DISTÂNCIA</div></div><div class="roto-stat"><div class="val">${r.tempo||'—'}</div><div class="lbl">ESTIMADO</div></div><div class="roto-stat"><div class="val red">${stops.length}</div><div class="lbl">POSTOS</div></div></div>`;
  if(r.linkRota)h+=`<a class="rota-link" href="${r.linkRota}" target="_blank">📍 VER ROTA COMPLETA NO MAPS</a>`;
  h+=`</div></div><div class="roto-scroll"><div class="timeline-wrap"><div class="timeline-line"></div><div class="timeline-stops">`;

  // Origin stop
  if(orig){
    let originDetails=orig.detalhe?`<div class="scard-details"><div class="scard-detail">🛣️ ${orig.detalhe}</div></div>`:'';
    h+=`<div class="stop"><div class="stop-node"><div class="stop-node-dot"></div></div><div class="stop-km">KM 0</div><div class="scard"><div class="scard-body"><div class="scard-brand-row"><div class="scard-brand-dot" style="background:#1c1c1c"></div><span class="scard-brand-name">Origem</span></div><div class="scard-nome">${orig.nome}</div><div class="scard-cidade">${orig.cidade}</div>${originDetails}</div></div></div>`;
  }

  // Fuel stops
  for(const p of r.paradas){
    if(p.tipo==='origem'||p.tipo==='destino')continue;
    h+=renderStop(p);
    if(p.alternativa)h+=renderAlt(p.alternativa);
  }

  // Destination
  if(dest){
    h+=`<div class="dest-stop"><div class="stop-node dest"><div class="stop-node-dot"></div></div><div class="dest-nome">Chegada · ${destCity}</div></div>`;
  }

  h+=`</div></div></div>`;
  return h;
}

// ══════════════════════════════════════════
// NAV
// ══════════════════════════════════════════
function showHome(){document.getElementById('screenHome').classList.add('active');document.getElementById('screenRoute').classList.remove('active');window.scrollTo(0,0)}
function showRoute(i){document.getElementById('routeContent').innerHTML=renderRoute(routes[i]);document.getElementById('screenHome').classList.remove('active');document.getElementById('screenRoute').classList.add('active');window.scrollTo(0,0)}

function saveSheetUrl(){const u=document.getElementById('sheetUrl').value.trim();u?localStorage.setItem('rotograma_sheet_url',u):localStorage.removeItem('rotograma_sheet_url');loadData()}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
async function loadData(){
  const sb=document.getElementById('statusBar'),st=document.getElementById('statusText'),dot=sb.querySelector('.dot');
  const url=localStorage.getItem('rotograma_sheet_url');
  if(url){document.getElementById('sheetUrl').value=url;st.textContent='Buscando planilha...';const d=await fetchFromSheet(url);if(d&&d.length){routes=d;dataSource='sheet';dot.className='dot on';st.textContent=`✓ ${routes.length} rota(s) da planilha`}else{routes=DEMO_DATA;dataSource='demo';dot.className='dot demo';st.textContent='Erro na planilha — dados de demonstração'}}
  else{routes=DEMO_DATA;dataSource='demo';dot.className='dot demo';st.textContent='Dados de demonstração'}
  renderHome();
}

// PWA
let dp;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('installBanner').classList.add('show')});
document.getElementById('installBtn')?.addEventListener('click',async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;document.getElementById('installBanner').classList.remove('show')});
document.getElementById('installDismiss')?.addEventListener('click',()=>{document.getElementById('installBanner').classList.remove('show')});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
loadData();
